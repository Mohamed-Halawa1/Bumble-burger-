<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#262633" />
      <stop offset="100%" stop-color="#101015" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC94B" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="380" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Spotlight circles -->
  <circle cx="250" cy="180" r="140" fill="#ECC94B" opacity="0.12" />
  <circle cx="250" cy="180" r="90" fill="#FFB800" opacity="0.08" />
  
  <!-- Outer glowing rings -->
  <circle cx="250" cy="180" r="130" fill="none" stroke="#ECC94B" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  
  <!-- Plate / Shadow -->
  <ellipse cx="250" cy="275" rx="160" ry="24" fill="#050508" opacity="0.8"/>
  <ellipse cx="250" cy="270" rx="140" ry="14" fill="#0C0C10" opacity="0.9" stroke="#ECC94B" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Main Center Graphic Item -->
  <g transform="translate(130, 60)" filter="url(#shadow)">
    <!-- Visual rendering based on type -->
    
        <!-- Red/Black Fries Box -->
        <path d="M60 90 L180 90 L165 170 L75 170 Z" fill="#E53E3E" stroke="#9B2C2C" stroke-width="2"/>
        <circle cx="120" cy="130" r="22" fill="#1A202C"/>
        <text x="120" y="137" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#FFB800" text-anchor="middle">B</text>
        
        <!-- Golden Crispy Fries sticks popping out -->
        <rect x="70" y="20" width="12" height="85" rx="3" fill="#ECC94B" stroke="#D69E2E" stroke-width="1.5" transform="rotate(-15 76 60)"/>
        <rect x="88" y="10" width="13" height="95" rx="3" fill="#F6E05E" stroke="#D69E2E" stroke-width="1.5" transform="rotate(-8 94 55)"/>
        <rect x="108" y="5" width="14" height="100" rx="3" fill="#ECC94B" stroke="#D69E2E" stroke-width="1.5"/>
        <rect x="128" y="10" width="13" height="95" rx="3" fill="#F6E05E" stroke="#D69E2E" stroke-width="1.5" transform="rotate(8 134 55)"/>
        <rect x="148" y="22" width="12" height="85" rx="3" fill="#ECC94B" stroke="#D69E2E" stroke-width="1.5" transform="rotate(18 154 60)"/>
        <rect x="98" y="25" width="12" height="80" rx="3" fill="#D69E2E" transform="rotate(4 104 65)"/>
        <rect x="135" y="28" width="12" height="75" rx="3" fill="#D69E2E" transform="rotate(-12 141 65)"/>
        
        <!-- Molten cheese drizzle on top -->
        <path d="M55 90 Q85 110, 120 95 Q155 115, 185 90" fill="none" stroke="#FFB800" stroke-width="8" stroke-linecap="round"/>
        
  </g>
  
  <!-- Floating Signature Badge -->
  <g transform="translate(30, 30)">
    <rect width="170" height="34" rx="17" fill="#181822" stroke="#ECC94B" stroke-width="1.5"/>
    <text x="85" y="21" font-family="'Outfit', 'Cairo', sans-serif" font-size="12" font-weight="800" fill="#FFB800" text-anchor="middle" letter-spacing="1">
      HOT & CRISPY
    </text>
  </g>
  
  <!-- Bottom info bar -->
  <rect x="30" y="315" width="440" height="42" rx="12" fill="#14141C" stroke="#2C2C38" stroke-width="1"/>
  <text x="50" y="341" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    بطاطس كلاسيك مقرمشة
  </text>
  <text x="450" y="340" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#FFB800" text-anchor="end">
    Crispy Golden Fries
  </text>
</svg>